name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chartanalyzer
          POSTGRES_USER: chartanalyzer
          POSTGRES_PASSWORD: chartanalyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chartanalyzer -d chartanalyzer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_SECRET: ci-only-test-secret-not-for-production
      DATABASE_URL: postgresql+asyncpg://chartanalyzer:chartanalyzer@localhost:5432/chartanalyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "backend[dev]"
      - run: ruff check backend
      - run: pytest backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
