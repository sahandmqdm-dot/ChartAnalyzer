name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chartanalyzer
          POSTGRES_USER: chartanalyzer
          POSTGRES_PASSWORD: chartanalyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chartanalyzer -d chartanalyzer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_SECRET: ci-only-test-secret-not-for-production
      DATABASE_URL: postgresql+asyncpg://chartanalyzer:chartanalyzer@localhost:5432/chartanalyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "backend[dev]"
      # The repository currently has pre-existing Ruff debt in unrelated modules.
      # Keep the Futures risk surface lint-gated while the legacy baseline is remediated.
      - run: >-
          ruff check
          backend/app/market_data/futures_risk.py
          backend/app/market_data/futures_risk_routes.py
          backend/app/market_data/futures_risk_alerts.py
          backend/app/market_data/risk_tiers.py
          backend/tests/test_futures_risk.py
          backend/tests/test_futures_risk_alerts.py
          backend/tests/test_futures_risk_assessment_route.py
          backend/tests/test_risk_tiers.py
          backend/app/market_data/open_interest.py
          backend/app/market_data/open_interest_repository.py
          backend/app/backtest/routes.py
          backend/app/backtest/futures_engine.py
          backend/app/market_data/futures_snapshot_repository.py
          backend/tests/test_futures_engine.py
          backend/tests/test_market_data.py
          backend/app/market_data/market_pressure.py
          backend/app/market_data/futures_analysis_routes.py
          backend/tests/test_open_interest.py
          backend/tests/test_open_interest_repository.py
          backend/tests/test_open_interest_routes.py
          backend/tests/test_market_pressure.py
          backend/app/auth.py
          backend/tests/test_auth.py
          backend/app/settings.py
          backend/app/market_data/futures_routes.py
          backend/tests/test_settings.py
          backend/tests/test_futures_routes.py
          backend/app/main.py
          backend/app/market_data/health.py
          backend/app/market_data/health_routes.py
          backend/tests/test_market_data_health.py
          backend/app/market_data/futures_stream.py
          backend/tests/test_futures_stream.py
          backend/tests/test_futures_stream_routes.py
          backend/app/market_data/liquidation_routes.py
          backend/app/market_data/liquidation_stream.py
          backend/tests/test_liquidation_stream.py
          backend/tests/test_liquidation_routes.py
      - run: pytest backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
