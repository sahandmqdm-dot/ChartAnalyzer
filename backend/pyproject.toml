[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="chartanalyzer-next-api"
version="0.1.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic-settings>=2.5,<3","httpx>=0.27,<1"]
[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-asyncio>=0.24,<1","httpx>=0.27,<1","ruff>=0.6,<1"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
asyncio_mode="auto"
[tool.ruff]
line-length=100
target-version="py312"

